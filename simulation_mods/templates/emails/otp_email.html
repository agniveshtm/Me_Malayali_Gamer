<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { background-color: white; padding: 30px; border-radius: 10px; max-width: 500px; margin: 0 auto; }
        .otp-box { background-color: #007bff; color: white; font-size: 32px; font-weight: bold; padding: 15px; text-align: center; border-radius: 5px; letter-spacing: 5px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Password Reset Request</h2>
        <p>Hi there,</p>
        <p>You requested to reset your password. Use the OTP below:</p>
        <div class="otp-box">{{ otp }}</div>
        <p><strong>Valid for 10 minutes.</strong></p>
        <p>If you didn't request this, please ignore this email.</p>
    </div>
</body>
</html>
