<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { background-color: white; padding: 30px; border-radius: 10px; max-width: 500px; margin: 0 auto; }
        .link-box { background-color: #007bff; color: white; font-size: 18px; font-weight: bold; padding: 15px; text-align: center; border-radius: 5px; margin: 20px 0; }
        .link-box a { color: white; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Email Verification</h2>
        <p>Hi there,</p>
        <p>Please verify your email by clicking the link below:</p>
        <div class="link-box"><a href="{{ verification_link }}">Verify Your Email</a></div>
        <p><strong>The link is valid for 24 hours.</strong></p>
        <p>If you didn't request this, please ignore this email.</p>
    </div>
</body>
</html>
